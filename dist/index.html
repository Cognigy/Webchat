<!doctype html>
<html lang="en">
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>webchat development</title>
	</head>

	<body>
		<script src="./webchat.js"></script>
		<script>
			initWebchat(
				"https://endpoint-dev.cognigy.ai/5f1d78a7902e746f041d99ac3c532dd29ddb52288a2af279e2d641e4184ef53d",
				{
					settings: {
						widgetSettings: {
							// emit "webchat/user-inactive" when the user is connected
							// but has not responded for 20 seconds
							userInactivity: {
								enabled: true,
								timeout: 20000,
							},
						},
					},
				},
			).then(function (webchat) {
				window.cognigyWebchat = webchat;

				// forward user-inactivity analytics events to the flow as a
				// data-only message (empty text does not render in the chat)
				webchat.registerAnalyticsService(function (event) {
					if (event.type === "webchat/user-inactive") {
						webchat.sendMessage("", {
							analyticsEvent: event.type,
							payload: event.payload,
						});
					}
				});

				webchat.open();
				webchat.startConversation();
			});
		</script>
	</body>
</html>
