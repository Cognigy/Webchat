name: Lint

on: [pull_request]

jobs:
    # Dependency vulnerability gate for pull requests (CGY-36979). Audits
    # package-lock.json, so no install is needed. Limited to production dependencies,
    # since dev tooling is not part of the published package and clearing the full tree
    # would mean major-upgrading Cypress and the webpack plugins.
    #
    # Scope: this repository's lock file only. The `ws` override in package.json is not
    # inherited by consumers of the published package, so a green run here says nothing
    # about what `npm install @cognigy/webchat` resolves. Closing that gap needs the
    # socket.io-client bump in Cognigy/SocketClient.
    audit:
        name: Audit Production Dependencies (this repo's lock file)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24.x
            - run: npm audit --omit=dev --audit-level=high

    # Accessibility lint gate. Runs ONLY the jsx-a11y rules as errors
    # (eslint.a11y.config.mjs) so it blocks PRs on WCAG 2.2 AA regressions
    # without being affected by unrelated, pre-existing lint debt.
    # See docs/accessibility.md for the accessibility governance setup.
    a11y:
        name: Accessibility lint (jsx-a11y)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24.x
                  cache: "npm"
            - run: npm ci
            - run: npm run lint:a11y

    # Full ESLint run for visibility. Non-blocking for now (continue-on-error)
    # because the broader codebase has pre-existing, non-accessibility lint debt
    # that is out of scope for the accessibility initiative.
    lint:
        name: ESLint (full, non-blocking)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24.x
                  cache: "npm"
            - run: npm ci
            - run: npm run lint
              continue-on-error: true
